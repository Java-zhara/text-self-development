<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карточки для саморазвития</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <!-- HEADER С НАВИГАЦИЕЙ -->
        <div class="header">
            <h1>📚 Саморазвитие</h1>
            <div class="nav-tabs" role="tablist">
                <button class="nav-tab active" data-mode="cards" role="tab" aria-selected="true">Карточки</button>
                <button class="nav-tab" data-mode="articles" role="tab" aria-selected="false">Статьи</button>
            </div>
        </div>

        <!-- ПРОГРЕСС -->
        <div class="progress">
            <div class="progress__bar" id="progressBar" role="progressbar" aria-valuemin="1" aria-valuenow="1" aria-valuemax="0" aria-label="Прогресс изучения">
                <div class="progress__fill" id="progressFill"></div>
            </div>
            <div class="progress__label" aria-live="polite">
                <span><strong id="progressMode">Карточка</strong> <span id="currentIndex">1</span> из <span id="totalCards">0</span></span>
            </div>
        </div>

        <!-- КАРТОЧКА -->
        <div class="card-wrapper" id="cardWrapper">
            <div class="card" id="card">
                <div class="card-front">
                    <img id="cardImage" src="" alt="" />
                    <div id="cardFrontTitle" class="card-front-title"></div>
                </div>
                <div class="card-back">
                    <div class="card-text" id="cardText"></div>
                    <div class="hint">👆 Нажмите, чтобы перевернуть</div>
                </div>
            </div>
        </div>

        <!-- СТАТЬЯ (полный текст) -->
        <div class="article-content" id="articleContent">
            <div class="article-title" id="articleTitle"></div>
            <div class="article-body" id="articleBody"></div>
        </div>

        <!-- ТОЧКИ-МИНИАТЮРЫ -->
        <div class="dots" id="dots" role="navigation" aria-label="Навигация по карточкам"></div>

        <!-- КНОПКИ УПРАВЛЕНИЯ -->
        <div class="controls" id="controls">
            <button id="prevBtn" type="button">◀ Предыдущая</button>
            <button id="nextBtn" type="button">Следующая ▶</button>
        </div>

        <div class="kbd-hint">
            <kbd>←</kbd> <kbd>→</kbd> — листать &nbsp;·&nbsp; <kbd>Пробел</kbd> — перевернуть &nbsp;·&nbsp; <kbd>1</kbd>–<kbd>9</kbd> — переход к карточке
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
